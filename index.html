<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confira os produtos disponíveis no Mercado Proz.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Mercado Proz</title>
</head>
<body>
    <div class="home-page">
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Mercado Proz</a>
                <a class="btn btn-outline-light btn-sm" href="admin.html">Área administrativa</a>
            </div>
        </nav>
        <main>
            <section class="home-hero">
                <div class="container py-5">
                    <p class="text-uppercase fw-semibold mb-2">Compre com qualidade</p>
                    <h1 class="display-5 fw-bold">Produtos para o seu dia a dia</h1>
                    <p class="lead mb-0">Confira nosso catálogo e encontre o que você precisa.</p>
                </div>
            </section>
            <section class="container py-5" aria-labelledby="catalogo-titulo">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-end gap-2 mb-4">
                    <div>
                        <p class="text-success fw-semibold mb-1">Mercado Proz</p>
                        <h2 class="h3 mb-0" id="catalogo-titulo">Nosso catálogo</h2>
                    </div>
                    <p class="text-secondary mb-0">Produtos disponíveis na loja</p>
                </div>

                <div class="catalog-grid" id="lista-produtos" aria-live="polite"></div>
            </section>
        </main>
        <footer class="border-top py-4">
            <div class="container text-secondary small">
                &copy;@ Mercado Proz
            </div>
        </footer>
    </div>
    <script src="scriptIndex.js"></script>
</body>
</html>
