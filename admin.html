<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="../favicon_io%20(1)/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="../favicon_io%20(1)/apple-touch-icon.png">
    <title>Mercado Proz - Adm</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                Mercado Proz
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm" href="index.html">
                            Início
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm" href="admin.html" aria-current="page">
                            Administrar Produtos
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container mt-4">
        <h1>Administrar Produtos</h1>
        <form id="formCadastro" class="formulario-cadastro">
            <div class="mb-3">
                <label for="nome" class="form-label">
                    Nome do Produto
                </label>

                <input type="text" id="nome" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="preco" class="form-label">
                    Preço do Produto
                </label>

                <input type="text" id="preco" class="form-control" inputmode="decimal" required>
            </div>
            <div class="mb-3">
                <label for="categoria" class="form-label">
                    Categoria do Produto
                </label>

                <input type="text" id="categoria" class="form-control" required>
            </div>
            <div class="d-flex gap-2 mt-4 mb-3">
                <button type="reset" class="btn btn-secondary">
                    Limpar
                </button>
                <button type="submit" class="btn btn-primary" id="btnEnviar">
                    +adicionar
                </button>
            </div>
        </form>
        <table class="table table-bordered border-secondary">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="itens">
            </tbody>
        </table>
    </main>
    <script src="scriptAdmin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
